name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GHSA-vfj7-8cjw-p6xm (braces DoS) has no patched version and affects only
      # dev dependencies (eslint-config-next). Filter it until upstream ships a fix.
      # Remove once braces publishes a fix (no patched version as of 2026-10-03).
      - name: Audit dependencies (excluding unfixable)
        run: |
          count=$(pnpm audit --json 2>/dev/null | jq '[.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | select(.value.github_advisory_id != "GHSA-vfj7-8cjw-p6xm")] | length')
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count high/critical advisories (excluding known unfixable)"
            pnpm audit --audit-level=high
            exit 1
          fi
          echo "No actionable high-severity advisories found"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          TURSO_DATABASE_URL: libsql://placeholder.turso.io
          TURSO_AUTH_TOKEN: placeholder

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'EOF'
          const fs = require("node:fs");
          const summary = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const format = (key) => `${summary[key].pct.toFixed(2)}% (${summary[key].covered}/${summary[key].total})`;
          const lines = [
            "## Test Coverage",
            "",
            "| Metric | Coverage |",
            "| --- | --- |",
            `| Lines | ${format("lines")} |`,
            `| Statements | ${format("statements")} |`,
            `| Functions | ${format("functions")} |`,
            `| Branches | ${format("branches")} |`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\\n")}\\n`);
          EOF
