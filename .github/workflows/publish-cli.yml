name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release step needs to write; everything else only reads.
      contents: write
      # npm trusted publishing (OIDC): npm exchanges this token for a
      # short-lived publish token, so no NPM_TOKEN secret is needed.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11, which supports trusted publishing (11.5.1+).
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm 11.5.1+ is required for trusted publishing'); process.exit(1) }" "$(npm --version)"

      # The CLI is a pnpm workspace package with no lockfile of its own, and its
      # build embeds ../../skills, so install from the repository root.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Set the version before building: the build inlines package.json's version.
      - name: Update version (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/cli
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $INPUT_VERSION" >&2
            exit 1
          fi
          npm version "$INPUT_VERSION" --no-git-tag-version

      - name: Check tag matches package version
        if: github.event_name == 'push'
        working-directory: packages/cli
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: pnpm vitest run packages/cli src/lib/skills-registry.test.ts

      - name: Build
        working-directory: packages/cli
        run: pnpm run build

      - name: Publish to npm
        working-directory: packages/cli
        # Authenticates with OIDC through the trusted publisher configured on
        # npmjs.com (webrenew/unicon, publish-cli.yml); provenance is automatic.
        run: npm publish --access public

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: CLI ${{ github.ref_name }}
          body: |
            ## @webrenew/unicon CLI ${{ github.ref_name }}
            
            Install with:
            ```bash
            npx @webrenew/unicon --help
            ```
            
            Or install globally:
            ```bash
            npm install -g @webrenew/unicon
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
