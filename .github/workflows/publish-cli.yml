name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # The CLI is a pnpm workspace package with no lockfile of its own, and its
      # build embeds ../../skills, so install from the repository root.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Set the version before building: the build inlines package.json's version.
      - name: Update version (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/cli
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Check tag matches package version
        if: github.event_name == 'push'
        working-directory: packages/cli
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: pnpm vitest run packages/cli src/lib/skills-registry.test.ts

      - name: Build
        working-directory: packages/cli
        run: pnpm run build

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: CLI ${{ github.ref_name }}
          body: |
            ## @webrenew/unicon CLI ${{ github.ref_name }}
            
            Install with:
            ```bash
            npx @webrenew/unicon --help
            ```
            
            Or install globally:
            ```bash
            npm install -g @webrenew/unicon
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
